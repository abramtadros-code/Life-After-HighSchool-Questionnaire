<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Life After High School: Student Pathway Questionnaire | Aspire High</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--navy-900:#0E2547;--navy-800:#12294D;--navy-700:#1B3A6B;--blue:#1257A8;--blue-bright:#1E7BE0;--red:#B3263E;--red-dark:#8E1C31;--sky:#EDF3FA;--line:#D3E1F2;--ink:#0E2547;--ink-soft:#4A6485;--display:"Archivo",system-ui,sans-serif;--body:"Public Sans",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--sky);color:var(--ink);font-family:var(--body);font-size:16.5px;line-height:1.6;-webkit-font-smoothing:antialiased}
:focus-visible{outline:3px solid var(--red);outline-offset:2px;border-radius:4px}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
.narrow{max-width:900px;margin:0 auto;padding:0 24px}
header{position:sticky;top:0;z-index:70;background:var(--navy-700);border-bottom:1px solid rgba(255,255,255,.12)}
.bar{display:flex;align-items:center;justify-content:space-between;height:72px;gap:16px}
.brand{display:flex;align-items:center;gap:11px}
.brand img{width:42px;height:42px;background:#fff;border-radius:10px;padding:3px}
.brand b{display:block;font-family:var(--display);font-weight:800;font-size:17.5px;color:#fff;line-height:1.15}
.brand i{display:block;font-style:normal;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:#A9C4E4}
.lang-btn{border:1.5px solid rgba(255,255,255,.45);background:none;color:#fff;font-family:var(--mono);font-size:12px;letter-spacing:.08em;padding:9px 14px;border-radius:9px;cursor:pointer}
.lang-btn:hover{background:#fff;color:var(--navy-800)}
.hero{background:var(--navy-800);color:#fff;padding:54px 0 60px;position:relative;overflow:hidden;border-bottom:5px solid var(--red)}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(to right,rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(to bottom,rgba(255,255,255,.05) 1px,transparent 1px);background-size:38px 38px;-webkit-mask-image:radial-gradient(110% 80% at 82% 12%,#000 22%,transparent 72%);mask-image:radial-gradient(110% 80% at 82% 12%,#000 22%,transparent 72%)}
.hero .wrap{position:relative;z-index:1;display:grid;grid-template-columns:1.4fr .6fr;gap:32px;align-items:center}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#F4C9D1;margin:0 0 14px;display:flex;align-items:center;gap:10px}
.eyebrow::before{content:"";width:26px;height:2px;background:var(--red);flex:none}
h1,h2{font-family:var(--display);letter-spacing:-.02em;line-height:1.12;margin:0}
h1{color:#fff;font-size:clamp(28px,4.6vw,46px);font-weight:800;margin-bottom:14px}
.hero p{color:#C3D6EC;margin:0;max-width:56ch}
.hero img{width:150px;justify-self:center;filter:drop-shadow(0 18px 34px rgba(0,0,0,.45))}
@media(max-width:700px){.hero .wrap{grid-template-columns:1fr}.hero img{display:none}.brand i{display:none}}
main{padding:32px 0 64px}
.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:26px 24px;margin-bottom:20px;box-shadow:0 20px 50px -44px rgba(14,37,71,.6)}
.card h2{font-size:22px;font-weight:700;color:var(--navy-900);margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.card p{margin:0 0 14px;color:var(--ink-soft)}
.note{border-left:4px solid var(--red);background:#FBF1F3;padding:12px 16px;border-radius:0 8px 8px 0;color:var(--navy-900);font-size:15px}
.small{font-size:13.5px;color:var(--ink-soft)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 18px}
.full{grid-column:1/-1}
@media(max-width:640px){.grid{grid-template-columns:1fr}}
.f{display:block;font-family:var(--display);font-size:14px;font-weight:600;color:var(--navy-900)}
input[type=text],input[type=tel],input[type=email],input[type=date],select,textarea{width:100%;margin-top:6px;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;font-family:var(--body);font-size:16px;color:var(--ink);background:#fff}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--blue-bright);outline:none;box-shadow:0 0 0 3px rgba(30,123,224,.16)}
.opts{display:grid;gap:10px;margin-top:8px}
.opts.cols{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:400;font-size:15.5px;color:var(--ink);cursor:pointer}
.check input{width:20px;height:20px;margin:3px 0 0;flex:none;accent-color:var(--red)}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px}
.submit{flex:1 1 260px;padding:15px 24px;background:var(--red);color:#fff;border:0;border-radius:9px;font-family:var(--body);font-size:16px;font-weight:600;cursor:pointer;transition:transform .15s,background .15s}
.submit:hover{background:var(--red-dark);transform:translateY(-2px)}
.clear{padding:15px 24px;background:#fff;color:var(--navy-900);border:1.5px solid var(--line);border-radius:9px;font-family:var(--body);font-size:16px;font-weight:600;cursor:pointer}
.clear:hover{border-color:var(--blue-bright);color:var(--blue)}
button:disabled{opacity:.6;cursor:default}
#msg{display:none;margin-top:16px;padding:14px 18px;border-radius:10px;font-weight:600;border:1px solid}
.ok{background:#F1FAF2;border-color:#B5DDBB;color:#1E5E28}
.err{background:#FDF2F2;border-color:#E7B4B4;color:#8E1C1C}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
footer{background:var(--navy-900);color:#B7CCE6;padding:28px 0;font-size:14px}
footer .wrap{display:flex;align-items:center;gap:12px}
footer img{width:34px;height:34px;background:#fff;border-radius:8px;padding:2px}
footer p{margin:0}
.small{white-space:pre-line}</style>
</head>

  function el(tag, cls, attrs) {
    var e = document.createElement(tag); if (cls) e.className = cls;

  }
  function tr(node, pair, star) {
    node.setAttribute('data-en', pair[0] + (star ? ' *' : '')); node.setAttribute('data-es', pair[1] + (star ? ' *' : '')); return node;
  }
  SECTIONS.forEach(function (s, i) {
    var card = el('div', 'card'), h = tr(el('h2'), s[0]);
    card.appendChild(h);
    var grid = el('div', 'grid');
    s[1].forEach(function (f) {
      var key = f[0], label = f[1], type = f[2], req = f[3], wide = f[4], opt = f[5];
      var box = el('div', wide ? 'full' : '');
      if (type === 'note') {
        box.appendChild(tr(el('p', 'small'), label));
      } else if (type === 'grp') {
        box.appendChild(tr(el('div', 'f'), label, req));
        var g = el('div', 'opts', { id: key, 'data-req': req });
        g.setAttribute('data-en', label[0]); g.setAttribute('data-es', label[1]); g.removeAttribute('data-en'); g.removeAttribute('data-es');
        g.labelPair = label;
        opt.forEach(function (o) {

        });
        if (f[6]) g.addEventListener('change', function (e) { if (g.querySelectorAll('input:checked').length > f[6]) e.target.checked = false; });

    if (form.website && form.website.value) { form.reset(); show(UI[lang].ok + 'PTH', true); return; }
    var data = { language: lang === 'en' ? 'English' : 'Spanish' };
    SECTIONS.forEach(function (s) { s[1].forEach(function (f) {
      if (f[2] === 'note') return;
      if (f[2] === 'grp') data[f[0]] = Array.prototype.map.call(

      else data[f[0]] = document.getElementById(f[0]).value;

    var btn = document.getElementById('btn');
